[project]
name = "rag-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shahbaj Sheikh", email = "thisisshahbaj@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.4",
    "langchain-openrouter>=0.2.9",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.19",
    "pypdf>=7.0.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sentence-transformers>=6.3.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.8",
    "torch>=2.15.0",
]

[project.scripts]
rag-system = "rag_system:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
